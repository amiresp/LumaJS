<section data-id="root" class="luma-swiper-slider" aria-label="Featured content">
  <swiper-container data-id="swiper" init="false" pagination="true" navigation="true" a11y="true" slides-per-view="1" space-between="12"></swiper-container>
  <template data-id="slide-template">
    <swiper-slide data-id="slide">
      <article data-id="slide-content">
        <a data-id="link" hidden><img data-id="image" alt="" loading="lazy" hidden></a>
        <img data-id="standalone-image" alt="" loading="lazy" hidden>
        <h3 data-id="title"></h3>
        <p data-id="text"></p>
      </article>
    </swiper-slide>
  </template>
  <p data-id="status" role="status" aria-live="polite"></p>
</section>
