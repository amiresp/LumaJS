<section data-id="root" class="luma-story">
  <button data-id="open" type="button">Open stories</button>
  <div data-id="viewer" class="luma-story-viewer" role="dialog" aria-modal="true" aria-label="Stories" hidden>
    <div class="luma-story-controls"><span data-id="progress" aria-live="polite"></span><button data-id="close" type="button" aria-label="Close stories">✕</button></div>
    <article data-id="story-item"><h2>Welcome to LumaJS</h2><p>Story component, no external library.</p></article>
    <article data-id="story-item" hidden><h2>Customizable</h2><p>Themes override presentation, not JavaScript.</p></article>
    <div class="luma-story-controls"><button data-id="previous" type="button">Previous</button><button data-id="next" type="button">Next</button></div>
  </div>
</section>
