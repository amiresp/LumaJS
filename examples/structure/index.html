<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LumaJS architecture playground</title><style>body{font:16px system-ui;margin:2rem auto;max-width:780px;padding:0 1rem}nav{display:flex;gap:1rem}section{margin:1rem 0}</style></head><body>
<nav><a href="?page=home">Home</a><a href="?page=sample">Sample page</a><a href="../basic/">Components demo</a></nav>
<main data-id="page"></main><section data-id="feature"><h2 data-id="sample-title"></h2></section><section data-id="option"><p data-id="option-message"></p></section>
<div data-luma="Alert"></div>
<script type="module">
import {Luma} from "../../js/core/Luma.js";
import {GlobalApp} from "../../js/dependency/global/GlobalApp.js";
import {SampleApp} from "../../js/Features/Sample/SampleApp.js";
import {SampleOption} from "../../js/Option/Sample/SampleApp.js";
import {renderHome} from "../../apps/website/pages/Home.js";
import {renderSample} from "../../apps/website/pages/Sample.js";
const runtime=new Luma({base:"../../"});
const global=new GlobalApp(runtime);
await global.mount(document);
const current=new URL(location.href).searchParams.get("page")==="sample"?"sample":"home";
const page=(current==="home"?renderHome:renderSample)(document.querySelector('[data-id="page"]'));
const feature=new SampleApp().mount(document.querySelector('[data-id="feature"]'));
const option=new SampleOption().mount(document.querySelector('[data-id="option"]'));
global.get("Alert")?.show("GlobalApp mounted the shared Alert component",{type:"success"});
addEventListener("pagehide",()=>{page.destroy();feature.destroy();option.destroy();void global.destroy();},{once:true});
</script></body></html>
