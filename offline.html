<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline | LumaJS</title><style>body{font:1rem system-ui;margin:0;min-height:100dvh;display:grid;place-items:center;background:#101827;color:white}main{text-align:center;padding:2rem;max-width:32rem}button{font:inherit;padding:.7rem 1.2rem;border:0;border-radius:.5rem;cursor:pointer}</style></head><body><main><h1>You're offline</h1><p>This page needs an internet connection or cached assets. Reconnect and try again.</p><button type="button" data-id="retry">Retry connection</button><p data-id="status" role="status"></p></main><script>document.querySelector('[data-id="retry"]').addEventListener("click",()=>{document.querySelector('[data-id="status"]').textContent="Trying again…";location.reload();});</script></body></html>
